<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Prawnik Symulator</title>

    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#111111">

    <!-- Style -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>⚖️ Prawnik Symulator</h1>

    <div class="stats">
        💰 Pieniądze: <span id="money">0</span> $<br>
        ⭐ Doświadczenie (XP): <span id="xp">0</span>
    </div>

    <div class="actions">
        <button onclick="takeCase()">🎲 Zwykła sprawa</button>
        <button onclick="takeVIPCase()">💎 VIP sprawa</button>
        <button onclick="buyXP()">🧠 Kup 5 XP</button>
        <button onclick="openShop()">🏪 Sklep</button>
        <button onclick="openAdmin()">🔒 Admin</button>
    </div>

    <div id="log">Witaj w Prawnik Symulator</div>

    <div id="shop" class="hidden"></div>

    <!-- Game logic -->
    <script src="app.js"></script>

</body>
</html>
